name: Update price list

on:
  workflow_dispatch:
    inputs:
      strict_new_items:
        description: "Fail when the sheet contains products not present in the JS"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC. 06:00 UTC = 15:00 JST.
    - cron: "30 9,12,18 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: update-price-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Update and validate price data
        shell: bash
        run: |
          EXTRA_ARGS="--allow-new-items"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.strict_new_items }}" == "true" ]]; then
            EXTRA_ARGS=""
          fi
          python scripts/update_price_list.py $EXTRA_ARGS

      - name: Validate JavaScript syntax
        run: node --check en/price-list/price-list-data.js

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: price-list-update-report
          path: price-list-update-report.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- en/price-list/price-list-data.js; then
            echo "No price changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/price-list/price-list-data.js
          git commit -m "Update price list data"
          git push
